# Hatsune Miku Theme - YAML Showcase
# No color screams. Every color sings.

---
# Document start marker

# Theme metadata
theme:
  name: Hatsune Miku Ohime-sama Theme
  version: "3.9.39"
  variants:
    - dark
    - light
  author: Miku Fan
  license: MIT
  repository: https://github.com/vauxe/hatsune-miku-theme

# Stage architecture configuration
stageArchitecture:
  description: Four background tiers, one canonical voice
  canonicalColor: "#39C5BB"

  # Background tiers (the editor is the darkest regular surface)
  backgroundTiers:
    void:
      step: -1
      role: Empty groups, shadows
      isDarkest: true

    stage:
      step: 0
      role: Editor — the performance surface

    house:
      step: 1
      role: Structural chrome — sidebar, panels

    float:
      step: 2
      role: Menus, hovers, notifications

  # Twelve-tone hue grid (thirty degrees apart, her voice at the tonic)
  hueGrid:
    description: One hue family per cognitive role
    tones:
      - tone: tonic
        degree: 180
        voice: keywords

      - tone: lime
        degree: 120
        voice: strings

      - tone: azure
        degree: 240
        voice: constants

      - tone: blue
        degree: 270
        voice: types

      - tone: magenta
        degree: 330
        voice: operators

      - tone: red
        degree: 20
        voice: parameters

# Color palette
palette:
  teals:
    classic: "#39C5BB"
    sekai: "#33CCBB"
    neon: "#5DE4DB"
    ice: "#B2EBE7"
    deep: "#0D6B65"

  pinks:
    sekai: "#FF6B9D"
    accessory: "#E05096"
    soft: "#FF80AB"

  accents:
    amber: "#FFD740"
    green: "#9CCC65"
    purple: "#B388FF"
    coral: "#FF5370"

# Voice banks array
voiceBanks:
  - id: v2-classic
    name: Hatsune Miku V2
    version: V2
    year: 2007
    color: "#39C5BB"
    frequencyRange:
      min: 80
      max: 1100
    tags:
      - classic
      - original
      - iconic
    isActive: true

  - id: append-sweet
    name: Hatsune Miku Append (Sweet)
    version: Append
    year: 2010
    color: "#5FCEC8"
    frequencyRange:
      min: 100
      max: 900
    tags: [append, sweet, warm]
    isActive: true

  - id: nt
    name: Hatsune Miku NT
    version: NT
    year: 2020
    color: "#3ED1C8"
    frequencyRange:
      min: 80
      max: 1200
    tags: [modern, technology, clear]
    isActive: true

# Anchor and alias
defaults: &defaults
  timeout: 30
  retries: 3
  encoding: utf-8

# Merge key
production:
  <<: *defaults
  timeout: 60
  debug: false

development:
  <<: *defaults
  debug: true
  verbose: true

# Multi-line strings
description: |
  Hatsune Miku Ohime-sama Theme

  A VS Code color theme traced from Hatsune Miku's character design.
  Dark and light variants, built with perceptual color science.

  Features:
  - Twelve-tone hue grid with one hue family per cognitive role
  - Four background tiers: void, stage, house, float
  - APCA-gated readability with CVD-safe signal pairs

# Folded string
summary: >
  This theme treats your IDE as a stage: the editor is the
  performance surface and the chrome is the house around it.
  The canonical identity color #39C5BB remains
  THE foundation.

# Numbers
numbers:
  integer: 39
  float: 3.14159
  negative: -42
  scientific: 1.23e+10
  octal: 0o755
  hex: 0x39C5BB

# Booleans
booleans:
  enabled: true
  disabled: false
  yes_value: yes
  no_value: no
  on_value: on
  off_value: off

# Null values
nullValues:
  explicit: null
  tilde: ~
  empty:

# Timestamps
timestamps:
  date: 2007-08-31
  datetime: 2007-08-31T12:00:00Z
  withTimezone: 2007-08-31T12:00:00+09:00

# Complex nesting
kubernetes:
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: miku-stage
    namespace: vocaloid
    labels:
      app: miku-theme
      version: v2-classic
  spec:
    replicas: 3
    selector:
      matchLabels:
        app: miku-theme
    template:
      metadata:
        labels:
          app: miku-theme
      spec:
        containers:
          - name: stage
            image: miku/stage:latest
            ports:
              - containerPort: 8080
            env:
              - name: CANONICAL_COLOR
                value: "#39C5BB"
              - name: DEBUG
                value: "false"
            resources:
              limits:
                memory: "128Mi"
                cpu: "500m"

...
# Document end marker
