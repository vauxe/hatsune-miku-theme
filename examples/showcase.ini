; Hatsune Miku Theme - INI Showcase
; No color screams. Every color sings.

; =============================================================================
; Global settings (before any section)
; =============================================================================
name = Hatsune Miku
version = 2.0

; =============================================================================
; Main configuration section
; =============================================================================
[main]
; String values
title = Miku Stage Configuration
description = No color screams. Every color sings
author = Miku Fan

; Numeric values
max_energy = 100
default_bpm = 39
volume = 0.85

; Boolean values (various formats)
enabled = true
debug = false
auto_start = yes
logging = no
feature_flag = on
legacy_mode = off
strict = 1
relaxed = 0

; =============================================================================
; Color scheme
; =============================================================================
[colors]
; Hex colors
primary = #39C5BB
secondary = #00BCD4
accent = #E05096
background = #1A1F24
foreground = #C8DCD9

; Named colors
highlight = cyan
warning = orange

; RGB format
custom_rgb = rgb(57, 197, 187)

; =============================================================================
; Voice bank settings
; =============================================================================
[voicebank.v2]
name = V2 Classic
year = 2007
frequency_min = 80
frequency_max = 1100
quality = high
default = true

[voicebank.nt]
name = NT
year = 2020
frequency_min = 55
frequency_max = 1500
quality = ultra
default = false

[voicebank.sekai]
name = Project SEKAI
year = 2020
frequency_min = 80
frequency_max = 1200
quality = high

; =============================================================================
; Performance settings
; =============================================================================
[performance]
; Arrays (comma-separated)
allowed_bpm = 60, 80, 100, 120, 140, 160, 180, 200
voice_types = dark, soft, light, sweet, vivid, solid
effects = reverb, echo, chorus

; Paths
output_dir = /var/miku/output
cache_dir = ${HOME}/.cache/miku
log_file = /var/log/miku/performance.log

; Time values
timeout = 30s
interval = 500ms
max_duration = 5m

; Size values
buffer_size = 4096
max_file_size = 100MB

; =============================================================================
; Network configuration
; =============================================================================
[network]
host = localhost
port = 3939
protocol = https
api_endpoint = /api/v2
websocket_enabled = true

; Multiple values
allowed_origins[] = https://miku.example.com
allowed_origins[] = https://stage.example.com
allowed_origins[] = http://localhost:3000

; =============================================================================
; Database settings
; =============================================================================
[database]
driver = postgresql
host = db.example.com
port = 5432
name = miku_stage
user = miku_user
; Note: In real configs, use environment variables for secrets
; password = ${DB_PASSWORD}
pool_size = 10
ssl_mode = require

; =============================================================================
; Logging configuration
; =============================================================================
[logging]
level = info
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
handlers = console, file
max_size = 10MB
backup_count = 5

[logging.console]
enabled = true
colorize = true

[logging.file]
enabled = true
path = /var/log/miku/app.log
rotation = daily

; =============================================================================
; Feature flags
; =============================================================================
[features]
new_ui = true
beta_voices = false
experimental_effects = false
analytics = true
telemetry = false

; =============================================================================
; Development overrides
; =============================================================================
[dev]
; Only loaded in development mode
mock_api = true
skip_auth = true
hot_reload = true
verbose_errors = true

; =============================================================================
; Production overrides
; =============================================================================
[prod]
; Only loaded in production mode
mock_api = false
skip_auth = false
hot_reload = false
verbose_errors = false
compression = gzip
minify = true

; =============================================================================
; Interpolation examples
; =============================================================================
[paths]
base_dir = /opt/miku
data_dir = %(base_dir)s/data
config_dir = %(base_dir)s/config
plugin_dir = %(base_dir)s/plugins

; Environment variable interpolation
home = ${HOME}
user = ${USER}
custom = ${MIKU_CUSTOM_VAR:-default_value}

; =============================================================================
; Comments and documentation
; =============================================================================

; Single-line comment with semicolon
# Single-line comment with hash (some parsers support this)

; Multi-line values (with continuation)
; Note: Continuation syntax varies by parser
long_description = This is a very long description \
    that spans multiple lines \
    for better readability

; End of configuration
